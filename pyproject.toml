[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collections-analytics-api"
version = "0.1.0"
description = "Read-only FastAPI analytics service for collections KPIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaque Carvalho" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# SQL Server access. Not needed to import the app or generate the OpenAPI document.
sqlserver = ["pyodbc>=5.0"]
# Targets upload: PDF table extraction.
pdf = ["pdfplumber>=0.11"]
# Error and performance reporting. Only active when SENTRY_DSN is set.
sentry = ["sentry-sdk>=2.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    # docs/openapi.json is generated by these exact versions. A test compares the
    # committed file with a fresh export, so a different schema generator would
    # fail it. Regenerate with `python scripts/export_openapi.py` after bumping.
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "starlette==1.7.0",
]

[project.scripts]
collections-api = "collections_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.x prefers httpx2 for its test client but still supports httpx.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI declares dependencies and Query() defaults in signatures

[tool.ruff.lint.per-file-ignores]
# SQL text lives in templates; wrapping it only makes the generated statements harder to read.
"src/collections_api/domains/**" = ["E501"]
"src/collections_api/core/sql.py" = ["E501"]
"tests/sqlite_adapter.py" = ["E501"]
